translate_structure:
  fields:
    data:
      example: '{"title": "Welcome", "items": ["Open", "Close"]}'
      selector:
        object:
    input_file:
      example: "/config/custom_components/my_integration/translations/en.json"
      selector:
        text:
    output_file:
      example: "/config/custom_components/my_integration/translations/de.json"
      selector:
        text:
    format:
      default: auto
      selector:
        select:
          mode: dropdown
          options: [auto, json, yaml]
    only_keys:
      example: '["name", "title", "message"]'
      selector:
        text:
          multiple: true
    ignore_keys:
